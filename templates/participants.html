<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Participants · {{ app_name }}</title><script>document.documentElement.dataset.theme=localStorage.getItem("monitor-theme")||"dark"</script><link rel="stylesheet" href="/static/css/admin-workspace.css"><link rel="stylesheet" href="/static/css/ui-help.css?v=20261003-workflow"></head><body>
<header class="workspace-header"><div><span class="overline">Research records</span><h1>Participants</h1><p>Create a profile before monitoring and recording a session.</p></div><nav><a href="/">Dashboard</a><a href="/calibration">Calibration</a></nav></header>
<main class="workspace-grid"><aside class="list-panel"><div class="panel-title"><div><h2>Participant directory</h2><small id="participant-count">Loading…</small></div><button id="new-participant">New participant</button></div><input id="participant-search" aria-label="Search participants by code or name" type="search" placeholder="Search code or name"><div id="participant-list" class="record-list"></div></aside>
<section class="form-panel"><div class="panel-title"><div><span class="overline">Profile</span><h2 id="form-title">Add participant</h2></div><span id="profile-status" class="status-chip">Not saved</span></div>
<form id="participant-form"><input id="participant-id" type="hidden"><div class="form-section"><h3>Identification</h3><div class="form-grid"><label>Participant ID / code<input id="participant-code" required maxlength="40" placeholder="Example: P-001"></label><label>Full name<input id="display-name" maxlength="120"></label><label>Date of birth<input id="date-of-birth" type="date"></label><label>Age group<input id="age-group" maxlength="40" placeholder="Example: 8–10 years"></label><label>Sex<select id="sex"><option value="">Not recorded</option><option>Male</option><option>Female</option><option>Intersex</option><option>Prefer not to say</option></select></label><label>Gender (optional)<input id="gender" maxlength="50"></label></div></div>
<div class="form-section"><h3>Education and study site</h3><div class="form-grid"><label>Grade / year level<input id="grade-level" maxlength="50"></label><label>School / clinic / study site<input id="school-site" maxlength="120"></label><label class="wide">Address (only when required by protocol)<input id="address" maxlength="240"></label></div></div>
<div class="form-section"><h3>Guardian and consent</h3><div class="form-grid"><label>Parent / guardian<input id="guardian-name" maxlength="120"></label><label>Consent reference<input id="consent-reference" maxlength="120"></label><label>Consent date<input id="consent-date" type="date"></label><label>Reported diagnosis status<select id="diagnosis-status"><option value="not_provided">Not provided</option><option value="under_assessment">Under assessment</option><option value="previously_diagnosed">Previously diagnosed</option></select></label></div></div>
<div class="form-section"><h3>Session preparation</h3><div class="form-grid"><label class="wide">Medication notes (optional)<textarea id="medication-notes" rows="2"></textarea></label><label class="wide">Relevant accommodations<input id="accommodations" maxlength="1000" placeholder="Communication, sensory, seating, or task accommodations"></label><label class="wide">Research notes<textarea id="research-notes" rows="3"></textarea></label></div></div>
<div class="form-actions"><span id="form-message"></span><button id="delete-participant" type="button" class="danger" disabled>Delete participant</button><button type="reset" class="secondary">Clear</button><button type="submit">Save participant</button></div></form></section></main><style>button:disabled{opacity:.4;cursor:not-allowed}.danger{margin-right:auto;border-color:#f07b8388;background:#2d171b;color:#ff9ca3}.danger:not(:disabled):hover{background:#482027}</style><script src="/static/js/ui-help.js"></script><script src="/static/js/participants.js"></script></body></html>
