<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unlock system setup · {{ app_name }}</title><link rel="stylesheet" href="/static/css/setup.css"></head><body><main class="center-card"><span class="eyebrow">Protected administration</span><h1>Unlock System Setup</h1><p>Confirm the owner or administrator access key before changing cameras, calibration, network, or advanced settings.</p>{% if error %}<div class="setup-alert error">{{ error }}</div>{% endif %}<form method="post" action="/system-setup" class="unlock-form"><input type="hidden" name="next" value="{{ next_path }}"><label>Access key<input type="password" name="access_key" required autofocus autocomplete="current-password"></label><button type="submit">Unlock for 15 minutes</button></form><a class="back-link" href="/">Return to operation</a></main></body></html>
